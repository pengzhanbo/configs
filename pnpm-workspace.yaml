    baseline-browser-mapping: ^2.11.20
    bumpp: ^12.2.2
    chokidar: ^5.0.0
    eslint-typegen: ^2.3.1
    nano-spawn: ^2.1.0
    nano-staged: ^1.0.2
    sass: ^1.103.1
    simple-git-hooks: ^2.14.0
